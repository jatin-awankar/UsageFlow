version: "29.1.3"

services:
  postgres:
    image: postgres:16
    container_name: usageflow-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: usageflow
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
